providers = ["node"]

[phases.setup]
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "libcups2",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libxrandr2",
  "libxss1",
  "libasound2",
  "libxshmfence1",
  "libdrm2",
  "libgbm1",
  "libxdamage1",
  "libgtk-3-0",
  "libxcb1",
  "libxcomposite1"
]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  # Fetch a known-good Chromium for Puppeteer to use
  "pnpm exec puppeteer browsers install chrome --path /usr/local/share/puppeteer",
  "pnpm run build"
]

[start]
cmd = "pnpm run start"

[variables]
PUPPETEER_CACHE_DIR = "/usr/local/share/puppeteer"

