providers = ["node"]

[phases.setup]
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "libnss3",
  "libatk-bridge2.0-0",
  "libxshmfence1",
  "libgbm1"
]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  # Fetch a known-good Chromium for Puppeteer to use
  "pnpm exec puppeteer browsers install chrome --path /usr/local/share/puppeteer",
  "pnpm run build"
]

[start]
cmd = "pnpm run start"

[variables]
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
PUPPETEER_CACHE_DIR = "/usr/local/share/puppeteer"

